<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142c2a"><title>CYBERORIGIN · 生产计划中心</title><link rel="stylesheet" href="style.css?v=2"><script type="module" src="app.js?v=2"></script></head>
<body>
<section id="login" class="login"><div class="login-art"><div class="brand"><b class="brand-icon">C</b> CYBERORIGIN</div><div><span class="eyebrow">PRODUCTION WORKSPACE</span><h1>让每一次交付<br>都有清晰的路径。</h1><p>设计 · 小批量验证 · 生产</p><div class="orbit"><i></i><i></i><i></i><span>PLAN<br><b>BUILD</b><br>DELIVER</span></div></div><small>生产计划与物料协同工作台</small></div><div class="login-form"><form id="login-form" onsubmit="return false"><span class="eyebrow">欢迎回来</span><h2>登录排产工作台</h2><p class="muted">输入专属账号，查看并维护项目计划。</p><label>账号<input name="username" autocomplete="username" required placeholder="请输入账号"></label><label>密码<div class="password-wrap"><input name="password" type="password" autocomplete="current-password" required placeholder="请输入密码"><button type="button" id="show-password" class="text-button">显示</button></div></label><p id="login-error" class="error" role="alert"></p><button class="primary full" id="login-submit">登录工作台 <span>↗</span></button><small class="muted">计划数据加密保存。修改保存在当前浏览器，可导出备份。</small></form></div></section>
<div id="workspace" hidden><aside><div class="brand"><b class="brand-icon">C</b><span>CYBERORIGIN<small>生产计划中心</small></span></div><div class="workspace-label">工作空间 <span>01</span></div><nav id="nav"><button data-view="overview" class="active"><span>◫</span>项目总览</button><button data-view="schedule"><span>▤</span>排期与甘特图</button><button data-view="tasks"><span>☷</span>任务工作台</button><button data-view="materials"><span>▦</span>物料与BOM</button><button data-view="batches"><span>◈</span>生产批次</button><button data-view="risks"><span>△</span>风险与问题</button></nav><div class="aside-bottom"><div class="live-dot"></div>本机加密保存<small>导出备份可迁移到其他设备</small><button id="logout">退出登录 ↗</button></div></aside><div class="main-shell"><header><div><span class="breadcrumb">工作空间</span><span class="breadcrumb"> / </span><strong id="crumb">项目总览</strong></div><div class="header-right"><span class="save-status" id="save-status">已载入计划</span><button class="quiet" id="export">↓ 导出备份</button><button class="quiet" id="import">↑ 导入</button><input type="file" id="import-file" accept="application/json" hidden><span class="avatar" title="当前账户">C</span></div></header><main id="content"></main><footer>CYBERORIGIN · 四目数据采集器 <span>计划基线 2026.11.16 · 排期为目标窗口，供应商确认后执行</span></footer></div></div>
<dialog id="editor"><form id="editor-form" onsubmit="return false"><div class="dialog-head"><div><span class="eyebrow" id="editor-label">编辑</span><h2 id="editor-title">编辑任务</h2></div><button type="button" class="icon-button" id="close-editor" aria-label="关闭">×</button></div><div id="editor-fields"></div><p id="editor-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" class="quiet danger" id="delete-record">删除记录</button><div><button type="button" class="quiet" id="cancel-editor">取消</button><button class="primary">保存修改</button></div></div></form></dialog><div id="toast" role="status"></div>
</body></html>
